[package]
name         = "mediation"
description  = "Telecom usage mediation as a pure Rust library: normalise, deduplicate, correlate and reconcile CDRs from mobile and fixed-line networks, with a conservation law that proves no record was lost. Zero I/O, no clock, integer quantities."
version      = "0.3.0"
authors      = ["hupe1980"]
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/mediation"
homepage     = "https://hupe1980.github.io/mediation"
documentation = "https://docs.rs/mediation"
rust-version = "1.94"
readme       = "README.md"

# Site pages are doctests (`src/lib.rs`, `cfg(doctest)`); the rest of the site is
# not needed to build the published crate.
exclude = [
    "site/templates/",
    "site/sass/",
    "site/static/",
    "site/config.toml",
    ".github/",
]
keywords     = ["telecom", "cdr", "mediation", "charging", "billing"]
categories   = ["data-structures", "parser-implementations"]

[dependencies]
serde     = { version = "1", features = ["derive"], optional = true }
thiserror = "2"
time      = { version = "0.3", features = ["std", "macros", "parsing", "formatting"] }

[features]
default = []
serde   = ["dep:serde", "time/serde"]

[dev-dependencies]
proptest   = "1"
serde_json = "1"
time       = { version = "0.3", features = ["macros"] }