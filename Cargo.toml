[package]
name         = "mediation"
description  = "Telecom usage mediation domain library — one-pass batch processing with a conservation law that proves no record was lost, 3GPP CDR local-time-plus-offset arithmetic (quarter-hour offsets, DST-adjusted), integer octet volumes, validated identifiers (IMSI/MSISDN/IMEI/ICCID/SUPI/GPSI/PEI/SUCI, PLMN, TADIG), natural-key deduplication, RFC 1982 wrap-aware sequence-gap detection, partial-record reassembly, cross-node correlation, signed restatement, a numbered validation catalogue, wire codecs for TBCD/BCD, ISDN-AddressString, the PLMN identity and the full User Location Information element, a zero-copy BER reader, usage aggregation, roaming-batch reconciliation, longest-prefix number ranges with portability, conserving tariff-band apportionment, two-question jurisdiction determination and an EU/German regulatory layer. Zero I/O, no async, no clock, exact integer quantities, and no input can panic a parser."
version      = "0.2.0"
authors      = ["hupe1980"]
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/mediation"
rust-version = "1.94"
readme       = "README.md"

# The documentation site is a build input for `cargo test` — every page is
# included as a doctest from `src/lib.rs` — but it is dead weight in the
# published `.crate`, which nobody runs doctests from. `cfg(doctest)` is off
# during a normal build, so the `include_str!`s are cfg-stripped before
# expansion and the packaged crate compiles without these files.
exclude = [
    "site/templates/",
    "site/sass/",
    "site/static/",
    "site/config.toml",
    ".github/",
]
keywords     = ["telecom", "cdr", "mediation", "charging", "roaming"]
categories   = ["data-structures", "parser-implementations"]

[dependencies]
serde     = { version = "1", features = ["derive"], optional = true }
thiserror = "2"
time      = { version = "0.3", features = ["std", "macros", "parsing", "formatting"] }

[features]
default = []
serde   = ["dep:serde", "time/serde"]

[dev-dependencies]
proptest   = "1"
serde_json = "1"
time       = { version = "0.3", features = ["macros"] }