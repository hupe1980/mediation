{%- set docs = get_section(path="docs/_index.md") -%}
<nav class="docnav" aria-label="Documentation">
  <form class="docsearch" role="search" onsubmit="return false">
    <label class="sr-only" for="q">Search the documentation</label>
    <input id="q" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
    <ul id="results" hidden></ul>
  </form>
  <ol>
    {%- for p in docs.pages %}
    <li{% if page and page.permalink == p.permalink %} class="here" aria-current="page"{% endif %}>
      <a href="{{ p.permalink | safe }}">{{ p.title }}</a>
      {%- if page and page.permalink == p.permalink and page.toc %}
      <ul class="onthispage">
        {%- for h in page.toc %}
        <li><a href="{{ h.permalink | safe }}">{{ h.title }}</a></li>
        {%- endfor %}
      </ul>
      {%- endif %}
    </li>
    {%- endfor %}
  </ol>
</nav>
