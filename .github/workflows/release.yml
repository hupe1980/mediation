name: Release

# Publishes to crates.io by Trusted Publishing (GitHub OIDC): no crates.io token is
# stored anywhere. The publish job exchanges a short-lived GitHub OIDC token for a
# crates.io token that rust-lang/crates-io-auth-action revokes when the job ends.
#
# crates.io → mediation → Settings → Trusted Publishing: GitHub publisher,
# repository `hupe1980/mediation`, workflow `release.yml`, environment `crates-io`
# (configured 2026-11-20). Recommended on GitHub: a required reviewer on the
# `crates-io` environment and a ruleset restricting who may create `v*` tags. Once a
# release published this way shows `trustpub_data` in
# https://crates.io/api/v1/crates/mediation/<version>, enable "trusted publishing
# only" on crates.io and delete any CARGO_REGISTRY_TOKEN secret.
#
# Never add a `pull_request_target` or `workflow_run` trigger to this workflow.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check but skip the crates.io publish"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: stable

jobs:
  verify:
    name: ✅ verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Resolve crate version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Crate version: $version"

      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo publish --dry-run --all-features

  publish:
    name: 🚀 publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    environment: crates-io
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing
    # The only job that can mint a token: no cache, nothing but the publish.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run --locked --all-features
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --all-features

  github-release:
    name: 🏷️ GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "v${{ needs.verify.outputs.version }}" \
            --generate-notes \
            --verify-tag
